name: CI

on:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_call:
    inputs:
      report_results:
        description: Publish test and check results.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      report_results:
        description: Publish test and check results.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check_python_module:
    name: Check python module
    uses: ./.github/workflows/check_module.yml
  check_docs:
    name: Check docs
    uses: ./.github/workflows/check_docs.yml
  checks_succeeded:
    name: Checks succeeded
    needs: [check_python_module, check_docs]
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  run_unit_tests:
    name: Run unit tests
    uses: ./.github/workflows/run_unit_tests.yml
    needs: [checks_succeeded]
  report_test_results:
    name: Report test results
    uses: ./.github/workflows/report_test_results.yml
    needs: [run_unit_tests]
    if: ${{ always() && (github.event_name != 'workflow_call' || inputs.report_results) }}
    with:
      publish_results: ${{ inputs.report_results }}