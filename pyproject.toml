[project]
name = "nitlsconfig"
version = "1.0.0.dev0"
license = "MIT"
description = "Python API for reading nitlsconfig configurations"
authors = [{name = "NI", email = "opensource@ni.com"}]
maintainers = [
  {name = "Philip Thong", email = "philip.thong@emerson.com"},
]
readme = "README.md"
keywords = ["nitlsconfig", "tls", "configuration"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: Microsoft :: Windows",
	"Operating System :: POSIX",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/ni/pypi-nitlsconfig"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "nitlsconfig", from = "src" }]
requires-poetry = '>=2.1,<3.0'

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
orjson = ">=3.9,<4.0"


[tool.poetry.group.lint.dependencies]
bandit = { version = ">=1.7", extras = ["toml"] }
ni-python-styleguide = ">=0.4.1"
mypy = ">=1.0"
pyright = { version = ">=1.1.400", extras = ["nodejs"] }

[tool.poetry.group.test.dependencies]
pytest = ">=7.2"
pytest-cov = ">=4.0"
pytest-mock = ">=3.0"
pytest-env = ">=1.0,<2.0"


[tool.poetry.scripts]
nitlsconfig-read = "nitlsconfig.cli:nitlsconfig_main"

[tool.pytest_env]
env_files = [".env"]

[tool.ni-python-styleguide]
extend_exclude = ".tox,docs"
application-import-names = "nitlsconfig,tests"

[tool.black]
extend-exclude = '\.tox/|docs/'
line-length = 100

[tool.mypy]
files = "src/nitlsconfig/,tests/"
namespace_packages = true
strict = true

[tool.bandit]
skips = [
	"B101", # assert_used
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --strict-markers"
testpaths = ["src/nitlsconfig", "tests"]

[tool.pyright]
include = ["src/", "tests/"]
